name: facture-fasso
services:
  app:
    build: .
    container_name: facture-fasso-app
    restart: unless-stopped
    env_file: .env.local
    environment:
      SUPABASE_INTERNAL_URL: http://supabase_kong_Facture-Fasso:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FACTURE_APP_PORT:-3000}:3000"
    networks:
      - supabase
networks:
  supabase:
    external: true
    name: supabase_network_Facture-Fasso
