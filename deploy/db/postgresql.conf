# =============================================================================
# GFB-STOCK : tuning PostgreSQL pour un VPS 2-4 Go de RAM (partage avec
# app Next.js + 8 services Supabase). Fichier d'OVERRIDE, pas un postgresql.conf
# complet : l'image supabase/postgres l'inclut a la fin de sa config via
# include_dir = '/etc/postgresql-custom/conf.d'. Monter en lecture seule :
#   ./deploy/db/postgresql.conf:/etc/postgresql-custom/conf.d/99-fasso.conf:ro
# NE PAS toucher : wal_level=logical (requis par Realtime), shared_preload_libraries.
# Profil par defaut : 2 Go. Pour 4 Go, voir les valeurs "# 4G" en commentaire.
# =============================================================================

# --- Connexions (PostgREST/Auth/Storage/Realtime utilisent des pools) -------
max_connections = 100

# --- Memoire ------------------------------------------------------------
shared_buffers = 384MB            # ~20-25 % de la RAM allouee a la DB   # 4G: 768MB
effective_cache_size = 1GB        # estimation du cache OS               # 4G: 2GB
work_mem = 8MB                    # par tri/hash et par connexion        # 4G: 16MB
maintenance_work_mem = 96MB       # VACUUM, CREATE INDEX                 # 4G: 192MB
huge_pages = off

# --- WAL / checkpoints ----------------------------------------------------
wal_compression = on
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB                # evite des checkpoints trop frequents
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# synchronous_commit reste 'on' : une facture validee ne doit jamais etre perdue.

# --- Planificateur (SSD/NVMe VPS) -----------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Autovacuum (volume faible, beaucoup d'UPDATE sur stock/factures) -----
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# --- Robustesse / journaux --------------------------------------------------
idle_in_transaction_session_timeout = 5min
log_min_duration_statement = 500  # journalise les requetes > 500 ms
log_checkpoints = on
log_autovacuum_min_duration = 1s
