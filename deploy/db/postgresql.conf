# =============================================================================
# GFB-STOCK : tuning PostgreSQL pour un VPS 12 Go de RAM (6 vCPU, partage avec
# app Next.js + 8 services Supabase). Fichier d'OVERRIDE, pas un postgresql.conf
# complet : l'image supabase/postgres l'inclut a la fin de sa config via
# include_dir = '/etc/postgresql-custom/conf.d'. Monter en lecture seule :
#   ./deploy/db/postgresql.conf:/etc/postgresql-custom/conf.d/99-fasso.conf:ro
# NE PAS toucher : wal_level=logical (requis par Realtime), shared_preload_libraries.
# Profil par defaut : 12 Go (plafond conteneur db : 4 Go, cf. compose.prod.yaml).
# VPS plus petit : valeurs "# 4G" / "# 2G" en commentaire, et baisser mem_limit/shm_size de db.
# =============================================================================

# --- Connexions (PostgREST/Auth/Storage/Realtime utilisent des pools) -------
max_connections = 100

# --- Memoire ------------------------------------------------------------
shared_buffers = 2GB              # ~50 % du plafond conteneur db       # 4G: 768MB  2G: 384MB
effective_cache_size = 6GB        # estimation du cache OS               # 4G: 2GB  2G: 1GB
work_mem = 16MB                   # par tri/hash et par connexion        # 4G: 16MB  2G: 8MB
maintenance_work_mem = 512MB      # VACUUM, CREATE INDEX                 # 4G: 192MB  2G: 96MB
huge_pages = off

# --- WAL / checkpoints ----------------------------------------------------
wal_compression = on
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 2GB                # evite des checkpoints trop frequents  # 2G: 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# synchronous_commit reste 'on' : une facture validee ne doit jamais etre perdue.

# --- Planificateur (SSD/NVMe VPS) -----------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Autovacuum (volume faible, beaucoup d'UPDATE sur stock/factures) -----
autovacuum = on
autovacuum_max_workers = 3          # 6 vCPU : 3 suffisent
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# --- Robustesse / journaux --------------------------------------------------
idle_in_transaction_session_timeout = 5min
log_min_duration_statement = 500  # journalise les requetes > 500 ms
log_checkpoints = on
log_autovacuum_min_duration = 1s
